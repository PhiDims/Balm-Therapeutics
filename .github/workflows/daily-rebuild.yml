# Rebuilds the site every morning so past events move to the archive on their own.
# Add a Cloudflare Pages deploy hook URL as the repository secret CF_DEPLOY_HOOK.
name: Daily rebuild
on:
  schedule:
    - cron: "0 4 * * *"   # 5am in Lagos
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
